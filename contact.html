<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Vipul Negi</title>
  <meta name="description" content="Get in touch with Vipul Negi about product design, UX research or a new project.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="contact.html" data-cta-band="off">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="hero">
      <div class="container contact-grid">
        <div class="reveal">
          <span class="eyebrow"><span class="dot"></span>Available for new projects</span>
          <h1 style="font-size:var(--fs-3xl)">Let’s turn your “What ifs” into “Let’s dos”!</h1>
          <p class="lead">Tell me a little about your product, your team, or the problem keeping you up at night.</p>
          <ul class="contact-list">
            <li><a href="mailto:vipul1negi@gmail.com">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              vipul1negi@gmail.com</a></li>
            <li><a href="https://www.linkedin.com/in/vipul-negi19/" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.1c0-1.22-.02-2.79-1.7-2.79-1.7 0-1.96 1.33-1.96 2.7V21h-4z"/></svg>
              Connect on LinkedIn</a></li>
            <li><a href="https://drive.google.com/file/d/1iauAGseeMoaIC74NTz6H7hw4zyhPWUAh/view?usp=sharing" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
              View my resume</a></li>
          </ul>
        </div>

        <!-- Set data-endpoint="https://formspree.io/f/XXXX" to receive messages directly (see README) -->
        <form class="form reveal" id="contact-form" data-endpoint="" novalidate>
          <div class="field">
            <label for="name">Your good name *</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="That’s a nice name" required>
          </div>
          <div class="field">
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
          </div>
          <div class="field">
            <label for="message">Let’s talk, what’s on your mind? *</label>
            <textarea id="message" name="message" placeholder="Have questions for me? Drop me a message!" required></textarea>
          </div>
          <button class="btn btn--primary" type="submit" style="justify-self:start">Send message
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <p class="form-note" data-status role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
</body>
</html>
